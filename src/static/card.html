<div

            <img alt="Avatar Thumbnail" loading="lazy" width="500" height="250"
                 decoding="async" data-nimg="1"
                 class="absolute inset-0 h-full w-full object-cover" srcset="1x, 2x" src=""
                 style="color: transparent;">
        </div>
    </div>
    <div class="p-2">
        <a class="group flex w-fit items-center gap-2" href="">
            <div class="text-xs text-white/75 group-hover:underline">Avatar Creator</div>
        </a>
        <div class="my-1 flex max-w-[250px] items-center gap-2">
            <h4 class="line-clamp-1 truncate break-words font-medium text-white">Avatar Name
            </h4>
        </div>
        <ul class="mt-2 flex flex-wrap gap-1">
            <li
                    class="inline-flex items-center px-2 py-1 text-xs font-semibold transition-colors rounded-full bg-white/5 hover:bg-white/10 text-white">
                #IOS
            </li>
            <li
                    class="inline-flex items-center px-2 py-1 text-xs font-semibold transition-colors rounded-full bg-white/5 hover:bg-white/10 text-white">
                #Android
            </li>
            <li
                    class="inline-flex items-center px-2 py-1 text-xs font-semibold transition-colors rounded-full bg-white/5 hover:bg-white/10 text-white">
                #Desktop
            </li>
            <li
                    class="inline-flex items-center px-2 py-1 text-xs font-semibold transition-colors rounded-full bg-white/5 hover:bg-white/10 text-white">
                #Quest
            </li>
        </ul>
    </div>
    <div data-orientation="horizontal" role="none" class="relative shrink-0">
        <div class="hidden dark:block bg-zinc-800 h-[1px] w-full"></div>
        <div class="bg-zinc-800 h-[1px] w-full"></div>
    </div>
    <div class="flex items-center justify-end rounded-b-2xl gap-2 p-2 card-content">
        <button
                class="inline-flex items-center justify-center text-sm shadow-md gap-2 whitespace-nowrap justify-center duration-300 ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 rounded-lg border border-white/10 bg-neutral-900 text-neutral-50 hover:bg-neutral-800 hover:border-neutral-700 size-9 shrink-0 h-9 w-9">
            <i class="fas fa-star size-3.5" style="font-size: 1em;"></i>
        </button>
        <button
                class="inline-flex items-center text-sm shadow-md gap-2 whitespace-nowrap justify-center duration-300 ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 rounded-lg border bg-[var(--theme-15)] border-[var(--theme-50)] text-[var(--text-color)] hover:bg-[var(--theme-25)] hover:border-[var(--theme-30)] h-9 px-4 w-full">
            Equip
        </button>
