[package]
name = "snorlax-rs"
version = "0.1.0"
edition = "2024"

# https://github.com/johnthagen/min-sized-rust
[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
vrchatapi = "1.19.1"
once_cell = "1.20.3"
winapi = { version = "0.3.9", features = ["windef", "winuser"] }
webview2 = { version = "0.1.4" }
winit = { version = "0.24.0" }
image = "0.25.5"
serde_json = "1.0.139"
tokio = { version = "1.43.0", features = ["full"] }
lazy_static = "1.5.0"
futures-util = "0.3.31"
futures = "0.3.31"
reqwest = "0.12.12"
serde = { version = "1.0.218", features = ["derive"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
log = "0.4.26"
env_logger = "0.11.6"
lazy-regex = "3.4.1"
dotenv = "0.15.0"
warp = "0.3.7"
tempfile = "3.17.1"
notify = "8.0.0"
crossbeam = "0.8.4"
uri_encode = "1.0.3"