[package]
name = "snorlax-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
vrchatapi = "1.19.1"
rust-embed = { version = "8.6.0" }
once_cell = "1.20.3"
winapi = { version = "0.3.9", features = ["windef", "winuser"] }
webview2 = { version = "0.1.4" }
winit = { version = "0.24.0" }
native-windows-gui = { version = "1.0.4", features = ["high-dpi"] }
image = "0.25.5"
serde_json = "1.0.139"
tokio = { version = "1.43.0", features = ["full"] }
lazy_static = "1.5.0"
tokio-tungstenite = "0.26.2"
futures-util = "0.3.31"
futures = "0.3.31"
reqwest = "0.12.12"
serde = { version = "1.0.218", features = ["derive"] }
rusqlite = { version = "0.33.0", features = ["bundled"] }
log = "0.4.26"
env_logger = "0.11.6"
lazy-regex = "3.4.1"
dotenv = "0.15.0"